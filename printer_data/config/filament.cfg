#Filament configs and macros to load those variables faster.

[gcode_macro RESET_FILAMENT_VARS]
description: Resetuje offsety a limity na vychozi hodnoty tiskarny
gcode:
    SET_GCODE_OFFSET Z=0 MOVE=1        # Vrati Z na tvou zkalibrovanou nulu
    SET_PRESSURE_ADVANCE ADVANCE=0.05  # Tvoje nejčastější PA (např. pro PLA)
    SET_VELOCITY_LIMIT ACCEL=3000      # Tvoje standardní akcelerace
    M117 Reset hotov

[gcode_macro FILAMENT_PEN]
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0.0
    SET_GCODE_OFFSET Z_ADJUST=0

[gcode_macro FILAMENT_PLA]
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0.032
    SET_GCODE_OFFSET Z_ADJUST=0

[gcode_macro FILAMENT_PETG]
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0.055
    SET_GCODE_OFFSET Z_ADJUST=0.04

[gcode_macro FILAMENT_ASA]
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0.020
    SET_GCODE_OFFSET Z_ADJUST=0
    TEMPERATURE_WAIT SENSOR="temperature_sensor Enclosure" MINIMUM=35

[gcode_macro FILAMENT_TPU95]
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0.015
    SET_GCODE_OFFSET Z_ADJUST=0.06

[gcode_macro FILAMENT_PETPUL]
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0.045
    SET_GCODE_OFFSET Z_ADJUST=0.02