#PID macros here

#PID tuning
[gcode_macro PID_HOTEND]
gcode:
    Y_FAN_ON
    ZZZ_LED_R_ON
    ZZ_LED_TOP_ON
    Z_LED_L_OFF
    PID_CALIBRATE HEATER=extruder TARGET=245
    SAVE_CONFIG 

[gcode_macro PID_BED]
gcode:
    Y_FAN_ON
    ZZZ_LED_R_ON
    ZZ_LED_TOP_ON
    Z_LED_L_OFF
    PID_CALIBRATE HEATER=heater_bed TARGET=75
    SAVE_CONFIG