#LIST OF GENERAL MACROS
#--------------

[include LEDmacros.cfg]
[include PIDmacros.cfg]
[include BUZZERmacros.cfg]
[include filament.cfg]

#Bed leveling
[gcode_macro G29]
gcode:
    BED_MESH_CALIBRATE

#Start and End of print
[gcode_macro START_PRINT]
gcode:
    BUZZER_BEEP
    LINE_PURGE ; tvoje vlastní makro na purge
    
    ZZZ_LED_R_ON
    ZZ_LED_TOP_ON
    BUZZER_START
    M117 Printing...

[gcode_macro END_PRINT]
gcode:
    M104 S0 ; vypni trysku
    M140 S0 ; vypni bed
    G91
    G1 Z10 F600 ; zvedni trysku
    G90
    G1 X5 Y5 F3000 ; přejeď do rohu

    M106 S0  
    M18 

    M117 Job ended...

    UPDATE_DELAYED_GCODE ID=CHECK_TEMP_FOR_RELAY DURATION=1

#Print pause
[gcode_macro PAUSE]
description: Pause the print
rename_existing: PAUSE_BASE
gcode:
    M83
    G91
    G1 Z+5 E-3 F300 ; zvedni trysku, trochu retrakce
    G90
    G1 X10 Y10 F6000 ; přejeď na okraj
    BUZZER_PAUSE

    Y_FAN_ON
    ZZZ_LED_R_ON
    ZZ_LED_TOP_OFF
    Z_LED_L_OFF

    M117 Print paused...
    
    PAUSE_BASE

#Print resume
[gcode_macro RESUME]
description: Resume the print
rename_existing: RESUME_BASE
gcode:
    BUZZER_PAUSE

    ZZZ_LED_R_ON
    ZZ_LED_TOP_ON
    Z_LED_L_OFF

    M117 Printing again...
    
    RESUME_BASE

#Print Load filament
[gcode_macro LOAD_FILAMENT]
description: "Načte filament do hotendu"
gcode:
    M117 Načítám filament...
    Y_FAN_ON
    ZZZ_LED_R_ON
    ZZ_LED_TOP_ON
    Z_LED_L_OFF
    M83                         ; relativní režim posuvu
    G92 E0                      ; reset extruderu
    M104 S240                   ; nahřej trysku (uprav dle materiálu)
    M109 S240                 ; počkej na nahřátí
    G1 E20 F300                 ; pomalu zatlač filament
    G1 E50 F1000                ; rychlejší dávkování
    M117 Filament načten
    BUZZER_BEEP

#Print Unload filament
[gcode_macro UNLOAD_FILAMENT]
description: "Vytáhne filament z hotendu"
gcode:
    M117 Vytahuji filament...
    Y_FAN_ON
    ZZZ_LED_R_ON
    ZZ_LED_TOP_ON
    Z_LED_L_OFF
    M83                         ; relativní režim posuvu
    G92 E0                      ; reset extruderu
    M104 S240                  ; nahřej trysku (uprav dle potřeby)
    M109 S240                  ; počkej na nahřátí
    G1 E5 F300                  ; zatlač kousek dopředu
    G1 E-80 F1000               ; rychlé vytažení
    M117 Filament vytažen
    BUZZER_BEEP
    
#Change filament/colour
[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    BUZZER_FILAMENT_CHANGE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state


#delayed gcode after print to not stress extruder
[delayed_gcode CHECK_TEMP_FOR_RELAY]
initial_duration: 0
gcode:
    # Target the extruder or heater_bed depending on your need
    {% if printer.extruder.temperature < 120 %}
        Y_FAN_OFF
        ZZ_LED_TOP_OFF
        {action_respond_info("Temp below 120C. Relay triggered.")}
    {% else %}
        # If still too hot, check again in 5 seconds
        UPDATE_DELAYED_GCODE ID=CHECK_TEMP_FOR_RELAY DURATION=5
    {% endif %}


#sleep mode
[gcode_macro SLEEP_MODE]
variable_sleep_mode: 0
gcode:


#Sleepmode turns on
[gcode_macro SLPPMOD_ON]
gcode:
    SET_GCODE_VARIABLE MACRO=SLEEP_MODE VARIABLE=sleep_mode VALUE=1
    Z_LED_L_OFF
    ZZ_LED_TOP_OFF
    ZZZ_LED_R_OFF
    
#Sleepmode turns off
[gcode_macro SLPPMOD_OFF]
gcode:
    SET_GCODE_VARIABLE MACRO=SLEEP_MODE VARIABLE=sleep_mode VALUE=0
    Z_LED_L_ON
    ZZ_LED_TOP_ON
    ZZZ_LED_R_OFF





    



    











    