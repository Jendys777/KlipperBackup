#BUZZER macros here

#BUZZER    
[gcode_macro BUZZER_BEEP]
gcode:
    SET_PIN PIN=buzzer VALUE=1
    G4 P500
    SET_PIN PIN=buzzer VALUE=0

[gcode_macro BUZZER_START]
gcode:
  {% if printer["gcode_macro SLEEP_MODE"].sleep_mode == 1%}
      M117 Skipped beeping sleepmode activated
  {% else %}    
      # rychlé 3 pulzy
      SET_PIN PIN=buzzer VALUE=1
      G4 P100
      SET_PIN PIN=buzzer VALUE=0
      G4 P100
      SET_PIN PIN=buzzer VALUE=1
      G4 P100
      SET_PIN PIN=buzzer VALUE=0
      G4 P100
      SET_PIN PIN=buzzer VALUE=1
      G4 P100
      SET_PIN PIN=buzzer VALUE=0
      G4 P300
      # jeden delší tón na rozjezd
      SET_PIN PIN=buzzer VALUE=1
      G4 P400
      SET_PIN PIN=buzzer VALUE=0
  {% endif %}    
    
[gcode_macro BUZZER_END]
gcode:
  {% if printer["gcode_macro SLEEP_MODE"].sleep_mode == 1%}
      M117 Skipped beeping sleepmode activated
  {% else %}   
      # jeden dlouhý tón
      SET_PIN PIN=buzzer VALUE=1
      G4 P600
      SET_PIN PIN=buzzer VALUE=0
      G4 P200
      # tři krátké, pomalé pulzy
      SET_PIN PIN=buzzer VALUE=1
      G4 P150
      SET_PIN PIN=buzzer VALUE=0
      G4 P150
      SET_PIN PIN=buzzer VALUE=1
      G4 P150
      SET_PIN PIN=buzzer VALUE=0
      G4 P150
      SET_PIN PIN=buzzer VALUE=1
      G4 P150
      SET_PIN PIN=buzzer VALUE=0
  {% endif %}       

[gcode_macro BUZZER_PAUSE]
gcode:
  {% if printer["gcode_macro SLEEP_MODE"].sleep_mode == 1%}
      M117 Skipped beeping sleepmode activated
  {% else %}   
      # krátký a delší tón
      SET_PIN PIN=buzzer VALUE=1
      G4 P100
      SET_PIN PIN=buzzer VALUE=0
      G4 P200
      SET_PIN PIN=buzzer VALUE=1
      G4 P400
      SET_PIN PIN=buzzer VALUE=0
  {% endif %}      

[gcode_macro BUZZER_FILAMENT_CHANGE]
gcode:
  {% if printer["gcode_macro SLEEP_MODE"].sleep_mode == 1%}
      M117 Skipped beeping sleepmode activated
  {% else %}   
      # čtyři krátké rychlé pulzy
      SET_PIN PIN=buzzer VALUE=1
      G4 P70
      SET_PIN PIN=buzzer VALUE=0
      G4 P70
      SET_PIN PIN=buzzer VALUE=1
      G4 P70
      SET_PIN PIN=buzzer VALUE=0
      G4 P70
      SET_PIN PIN=buzzer VALUE=1
      G4 P70
      SET_PIN PIN=buzzer VALUE=0
      G4 P70
      SET_PIN PIN=buzzer VALUE=1
      G4 P70
      SET_PIN PIN=buzzer VALUE=0
  {% endif %}  




      